<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <title>Minecraft Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <!-- SÖKFÄLT -->
  <div class="mc-search-container">
    <div class="mc-search-box">
      <input type="text" id="search-input" placeholder="Sök adress eller plats..." autocomplete="off">
      <button id="search-btn">🔍</button>
    </div>
    <div id="search-results" class="mc-search-results"></div>
  </div>

  <!-- HEADER -->
  <div class="mc-header-compact">
    <div class="turn-icon" id="turn-icon">➡️</div>
    <div class="header-text">
      <h1 id="instruction">Börja på Norrga Kvarn</h1>
      <p id="street">Sök efter destination</p>
    </div>
  </div>

  <!-- SIDOKNAPPAR -->
  <div class="mc-side-compact">
    <button class="mc-side-btn" id="layers-btn">🗺️</button>
    <button class="mc-side-btn" id="sound-btn">🔊</button>
    <button class="mc-side-btn" id="cancel-btn">❌</button>
  </div>

  <!-- LÅS + KOMPASS -->
  <div class="mc-center-controls">
    <button class="mc-lock-btn" id="lock-btn">🔓</button>
    <button class="mc-compass-btn" id="compass-btn">🧭</button>
  </div>

  <!-- BOTTOM -->
  <div class="mc-bottom-compact">
    <div class="mc-stats">
      <div class="stat-box"><span id="eta-time">--:--</span><small>ANK</small></div>
      <div class="stat-box"><span id="eta-min">--</span><small>MIN</small></div>
      <div class="stat-box"><span id="eta-km">--</span><small>KM</small></div>
    </div>
    <button class="mc-share-compact" id="share-btn">💬 DELA</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
  <script src="map.js"></script>
</body>
</html>
