<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <title>Minecraft Navigator</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- TOP HEADER - Minecraft style -->
  <div class="mc-header">
    <div class="mc-header-inner">
      <div class="turn-box">
        <span id="turn-arrow">➡️</span>
      </div>
      <div class="header-text">
        <h1 id="instruction">Börja på Norrga Kvarn</h1>
        <p id="street">Sök efter destination</p>
      </div>
    </div>
  </div>

  <!-- MAP -->
  <div id="map"></div>

  <!-- SIDE BUTTONS - Minecraft blocks -->
  <div class="mc-side-panel">
    <button class="mc-btn" id="overview-btn" title="Översikt">
      🗺️
    </button>
    <button class="mc-btn" id="sound-btn" title="Ljud">
      🔊
    </button>
    <button class="mc-btn" id="cancel-btn" title="Avbryt">
      ❌
    </button>
  </div>

  <!-- LOCK BUTTON -->
  <button id="lock-btn" class="mc-lock-btn">🔓</button>

  <!-- BOTTOM SHEET - Minecraft inventory style -->
  <div class="mc-bottom">
    <div class="mc-inventory">
      <div class="mc-slot">
        <div class="mc-time" id="eta-time">--:--</div>
        <div class="mc-label">ANKOMST</div>
      </div>
      <div class="mc-slot">
        <div class="mc-value" id="eta-min">--</div>
        <div class="mc-label">MIN</div>
      </div>
      <div class="mc-slot">
        <div class="mc-value" id="eta-km">--</div>
        <div class="mc-label">KM</div>
      </div>
    </div>
    <button class="mc-share-btn" id="share-btn">
      💬 DELA BERÄKNAD ANKOMST
    </button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
  <script src="map.js"></script>
</body>
</html>
