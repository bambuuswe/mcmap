<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <title>Minecraft Navigate</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- TOP HEADER --->
  <div class="nav-header">
    <div class="header-content">
      <div class="turn-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <circle cx="12" cy="12" r="10"/>
          <path d="M12 8v8M8 12l4 4 4-4"/>
        </svg>
      </div>
      <div class="header-text">
        <h1 id="next-instruction">Börja på din position</h1>
        <p id="street-name">Sök efter destination</p>
      </div>
    </div>
    <div class="header-grip"></div>
  </div>

  <!-- MAP -->
  <div id="map"></div>

  <!-- SIDE BUTTONS -->
  <div class="side-panel">
    <button class="side-btn" id="overview-btn" title="Översikt">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M12 2C8.13 2 5 5.13 5 9c0 5.25 7 13 7 13s7-7.75 7-13c0-3.87-3.13-7-7-7z"/>
      </svg>
    </button>
    <button class="side-btn" id="sound-btn" title="Ljud">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M3 9v6h4l5 5V4L7 9H3zm13.5 3c0-1.77-1.02-3.29-2.5-4.03v8.05c1.48-.73 2.5-2.25 2.5-4.02zM14 3.23v2.06c2.89.86 5 3.54 5 6.71s-2.11 5.85-5 6.71v2.06c4.01-.91 7-4.49 7-8.77s-2.99-7.86-7-8.77z"/>
      </svg>
    </button>
    <button class="side-btn" id="share-btn" title="Dela">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/>
      </svg>
    </button>
  </div>

  <!-- BOTTOM SHEET -->
  <div class="bottom-sheet">
    <div class="sheet-grip"></div>
    <div class="eta-grid">
      <div class="eta-item">
        <div class="eta-time" id="eta-time">--:--</div>
        <div class="eta-label">ankomst</div>
      </div>
      <div class="eta-item">
        <div class="eta-value" id="eta-min">--</div>
        <div class="eta-label">min</div>
      </div>
      <div class="eta-item">
        <div class="eta-value" id="eta-km">--</div>
        <div class="eta-label">km</div>
      </div>
    </div>
    <button class="share-eta-btn" id="share-eta-btn">
      <svg viewBox="0 0 24 24" fill="currentColor">
        <path d="M16 11c1.66 0 2.99-1.34 2.99-3S17.66 5 16 5c-1.66 0-3 1.34-3 3s1.34 3 3 3zm-8 0c1.66 0 2.99-1.34 2.99-3S9.66 5 8 5C6.34 5 5 6.34 5 8s1.34 3 3 3zm0 2c-2.33 0-7 1.17-7 3.5V19h14v-2.5c0-2.33-4.67-3.5-7-3.5zm8 0c-.29 0-.62.02-.97.05 1.16.84 1.97 1.97 1.97 3.45V19h6v-2.5c0-2.33-4.67-3.5-7-3.5z"/>
      </svg>
      Dela beräknad ankomst
    </button>
  </div>

  <!-- LOCK BUTTON -->
  <button id="lock-btn" class="lock-btn">🔓</button>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
  <script src="map.js"></script>
</body>
</html>
