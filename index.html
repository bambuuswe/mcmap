<!DOCTYPE html>
<html lang="sv">
<head>
  <meta charset="UTF-8" />
  <title>Minecraft Map</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <link href="https://fonts.googleapis.com/css2?family=VT323&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="map"></div>

  <!-- HEADER -->
  <div class="mc-header-compact">
    <div class="turn-icon">➡️</div>
    <div class="header-text">
      <h1 id="instruction">Börja på Norrga Kvarn</h1>
      <p id="street">Sök efter destination</p>
    </div>
  </div>

  <!-- SIDOKNAPPAR -->
  <div class="mc-side-compact">
    <button class="mc-side-btn" id="layers-btn" title="Kartlager">🗺️</button>
    <button class="mc-side-btn" id="sound-btn" title="Ljud på/av">🔊</button>
    <button class="mc-side-btn" id="cancel-btn" title="Avbryt">❌</button>
  </div>

  <!-- LÅSKNAPP (centrerad på höger sida) -->
  <button class="mc-lock-btn" id="lock-btn" title="Lås upp/lås">🔓</button>

  <!-- BOTTOM -->
  <div class="mc-bottom-compact">
    <div class="mc-stats">
      <div class="stat-box">
        <span id="eta-time">--:--</span>
        <small>ANK</small>
      </div>
      <div class="stat-box">
        <span id="eta-min">--</span>
        <small>MIN</small>
      </div>
      <div class="stat-box">
        <span id="eta-km">--</span>
        <small>KM</small>
      </div>
    </div>
    <button class="mc-share-compact" id="share-btn">💬 DELA</button>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <script src="https://unpkg.com/leaflet-routing-machine@3.2.12/dist/leaflet-routing-machine.js"></script>
  <script src="map.js"></script>
</body>
</html>
